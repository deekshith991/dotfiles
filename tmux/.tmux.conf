##### ─────────────────────────────────────────────
##### Terminal & Color Support
##### ─────────────────────────────────────────────

# Use truecolor-compatible terminal
set -g default-terminal "tmux-256color"

# Enable RGB (true color) support for xterm
set -as terminal-features ",xterm-256color:RGB"


##### ─────────────────────────────────────────────
##### Prefix Key Configuration
##### ─────────────────────────────────────────────

# Change prefix from Ctrl+b → Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Add mouse support
set -g mouse on

# history Limit
set -g history-limit 20000

##### ─────────────────────────────────────────────
##### Pane Navigation (Vim-style)
##### ─────────────────────────────────────────────

# Move between panes using h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### ─────────────────────────────────────────────
##### Window Management
##### ─────────────────────────────────────────────

# Create new window after current one
bind c new-window -a -c "#{pane_current_path}"

# Create new window in same path (default position)
bind C new-window -c "#{pane_current_path}"

# Start window numbering from 1
set -g base-index 1

# Auto-renumber windows after closing
set -g renumber-windows on


##### ─────────────────────────────────────────────
##### Pane Splitting (Vim-style)
##### ─────────────────────────────────────────────

# Vertical split (like Vim's :vsplit)
bind v split-window -h -c "#{pane_current_path}"

# Horizontal split (like Vim's :split)
bind s split-window -v -c "#{pane_current_path}"


##### ─────────────────────────────────────────────
##### Copy Mode (Vi Keybindings)
##### ─────────────────────────────────────────────

# Enable vi-style keybindings in copy mode
setw -g mode-keys vi

# Visual selection (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line

# Yank (copy) selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


##### ─────────────────────────────────────────────
##### Status Bar Styling
##### ─────────────────────────────────────────────

# Position and alignment
set -g status-position top
set -g status-justify left

# Transparent background
set -g status-style 'bg=default'
set -g status-bg default
set -g window-status-style "bg=default"
set -g window-status-current-style "bg=default"

# Left section (session name)
set -g status-left '#[fg=#1F1F28,bg=#957FB8,bold]  #S #[default]'
set -g status-left-length 20

# Right section (dynamic OFF indicator handled later)
set -g status-right ''

# Window appearance
setw -g window-status-separator ''
setw -g window-status-format '  #I #W #F  '
setw -g window-status-current-format '  #I #W #F  '

# Active window styling
setw -g window-status-current-style 'bg=#98BB6C fg=#1F1F28 bold'

# Inactive window styling
setw -g window-status-style 'bg=default fg=#C8C093'


##### ─────────────────────────────────────────────
##### Pane Borders
##### ─────────────────────────────────────────────

# Use single-line borders
set -g pane-border-lines single

# Inactive pane border color
set -g pane-border-style 'fg=#54546D'

# Active pane border color
set -g pane-active-border-style 'fg=#957FB8'


##### ─────────────────────────────────────────────
##### Nested Session Toggle (F12)
##### ─────────────────────────────────────────────

# Disable prefix only (safe for nested tmux)
bind -T root F12 \
  set -g prefix None \;\
  set -g status-style "fg=#C8C093,bg=#2D4F67" \;\
  display-message "OFF mode"

# Restore normal behavior
bind -T root F12 \
  set -u prefix \;\
  set -u status-style \;\
  display-message "ON mode"

##### ─────────────────────────────────────────────
##### Clipboard & Passthrough
##### ─────────────────────────────────────────────

# Allow applications (like Neovim) to access system clipboard
set -s set-clipboard on

# Allow passthrough for advanced terminal features
set -g allow-passthrough on

##### ─────────────────────────────────────────────
##### Popup Terminal
##### ─────────────────────────────────────────────

# Open a centered popup terminal (80% size)
bind-key p display-popup -E -w 80% -h 80% -T "  Popup Shell "

bind-key g display-popup -E -w 80% -h 80% "lazygit"
bind-key n display-popup -E -w 80% -h 80% "nvim"


##### ─────────────────────────────────────────────
##### Plugins
##### ─────────────────────────────────────────────

# Plugin Management plugin
run '~/.tmux/plugins/tpm/tpm'
